name: PQT-QCAT CI

on:
  push:
    branches: [ main, pqt-qcat-life-002, m5-refinement, 'feature/**' ]
  pull_request:
    branches: [ main, pqt-qcat-life-002 ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify SHA-256 Manifest
        run: |
          python verify_manifest.py

      - name: Run Full Test Suite (60 tests)
        run: |
          python -m pytest pqt_qcat/tests -v

      - name: Run M5 Evaluator Calibration Smoke Test (Seed 42)
        run: |
          python run_m5_evaluation.py --seed 42 --episodes 100
